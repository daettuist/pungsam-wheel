<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>풍성한 삶의 수레바퀴</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 스크롤 없는 한 화면. 왼쪽 수레바퀴(축=하나님, 허브=그리스도 안의 나, 바퀴살 8=네 관계의 핵심, 테=주님 오실 때까지), 오른쪽 설명/진단 */
:root{
  --paper:#fbf8f2; --card:#fffdf9; --ink:#1b2641; --muted:#5f677c; --head:#13254a;
  --gold:#a8802e; --gold-ink:#86661f; --gold-soft:#e6d3a3; --tint:#f2e8d2;
  --rule:#e1d9c8; --rule2:#cabfa7; --grid:#e6dfcf;
  --core:#13254a; --core-ink:#fbf8f2; --core-gold:#e2c88a;
  --hub:#2b4c8c; --rim:#617448;
  --god:#1f6f78; --self:#8a6343; --com:#4d6688; --world:#5a5d66;
  --seg:.16; --seg-on:.34; --fill:.82;
  --out:#ebe5d8; --shadow:rgba(19,37,74,.12);
  --red:#c0392b;
  --serif:"Noto Serif KR","Nanum Myeongjo","Apple SD Gothic Neo",serif;
  --sans:"IBM Plex Sans KR","Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0d1424; --card:#141e33; --ink:#e7e1d3; --muted:#a3a9b8; --head:#f3ecdc;
  --gold:#d8bc7a; --gold-ink:#dcc185; --gold-soft:#5c4e2c; --tint:#211d15;
  --rule:#243049; --rule2:#36435e; --grid:#222c43;
  --core:#24365e; --core-ink:#f3ecdc; --core-gold:#e2c88a;
  --hub:#93aee6; --rim:#aec38e;
  --god:#78c3c8; --self:#d0a77f; --com:#a3b7d3; --world:#b3b6be;
  --seg:.16; --seg-on:.32; --fill:.7;
  --out:#070c18; --shadow:rgba(0,0,0,.5);
  --red:#d9534a;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0d1424; --card:#141e33; --ink:#e7e1d3; --muted:#a3a9b8; --head:#f3ecdc;
  --gold:#d8bc7a; --gold-ink:#dcc185; --gold-soft:#5c4e2c; --tint:#211d15;
  --rule:#243049; --rule2:#36435e; --grid:#222c43;
  --core:#24365e; --core-ink:#f3ecdc; --core-gold:#e2c88a;
  --hub:#93aee6; --rim:#aec38e;
  --god:#78c3c8; --self:#d0a77f; --com:#a3b7d3; --world:#b3b6be;
  --seg:.16; --seg-on:.32; --fill:.7;
  --out:#070c18; --shadow:rgba(0,0,0,.5);
  --red:#d9534a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--out);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.68;word-break:keep-all;overflow-wrap:break-word;overflow:hidden}
h1,h2{font-family:var(--serif);color:var(--head);margin:0;line-height:1.3;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.app{position:absolute;left:50%;top:50%;width:600px;height:960px;transform:translate(-50%,-50%) scale(var(--fs,1));transform-origin:center center;display:grid;grid-template-rows:auto minmax(0,1fr);background:var(--paper);box-shadow:0 0 0 1px var(--rule),0 12px 40px var(--shadow);border-radius:6px;overflow:hidden}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px 16px;padding:12px 20px;border-bottom:1px solid var(--rule)}
.top .eb{font-size:.72rem;font-weight:600;letter-spacing:.14em;color:var(--gold-ink)}
.top h1{font-size:1.32rem;font-weight:900}
.modes{display:flex;gap:6px}
.mbtn{border:1px solid var(--rule2);background:var(--card);border-radius:99px;padding:5px 16px;font-size:.88rem;font-weight:500}
.mbtn[aria-pressed="true"]{background:var(--core);color:var(--core-ink);border-color:var(--core)}

.stage{display:grid;min-height:0}
.svgbox{min-height:0;min-width:0;height:100%;display:flex;align-items:center;justify-content:center}
svg.wh{width:100%;height:100%;display:block;touch-action:manipulation}
.cap{align-self:center;display:grid;gap:12px;min-width:0;max-height:100%;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin}
.k{font-size:.76rem;font-weight:600;letter-spacing:.1em;color:var(--gold-ink)}
.cap h2{font-size:clamp(1.3rem,2.4vw,1.8rem);font-weight:900}
.keys{display:flex;flex-wrap:wrap;gap:6px}
.keys span{font-family:var(--serif);font-weight:700;border:1.5px solid var(--rc,var(--gold));border-radius:99px;padding:2px 12px;font-size:.95rem;color:var(--head)}
.q{font-family:var(--serif);color:var(--head);font-size:clamp(1rem,1.45vw,1.1rem);line-height:1.72;border-left:3px solid var(--gold);padding-left:14px}
.src{font-size:.8rem;color:var(--muted);padding-left:17px;margin-top:-6px}
.note{font-size:.9rem;color:var(--muted)}
.subs{display:grid;gap:6px}
.subs p{font-size:.94rem;line-height:1.62}
.subs b{font-family:var(--serif);font-weight:700;color:var(--rc);margin-right:8px}
.subs .ss{font-size:.76rem;color:var(--muted)}
.show-m{display:none}
.cmt{font-size:.93rem;line-height:1.6;color:var(--ink)}
.cmt.pr{border-left:3px solid var(--rc);padding-left:12px}
.cmt-h{font-family:var(--serif);font-weight:700;color:var(--rc);font-size:.98rem;margin-top:4px}
.why{font-size:.76rem;color:var(--muted);margin-top:-4px}
.map{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.9rem;align-items:baseline}
.map b{font-family:var(--serif);color:var(--head);white-space:nowrap}
.map span{color:var(--muted)}

/* 진단 */
.qtext{font-family:var(--serif);font-size:clamp(1.05rem,1.6vw,1.2rem);color:var(--head);line-height:1.6}
.scale{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.scale button{border:1px solid var(--rule2);background:var(--card);border-radius:4px;padding:6px 0;font-size:.9rem;font-weight:600;font-variant-numeric:tabular-nums}
.scale button[aria-pressed="true"]{background:var(--rc,var(--gold));border-color:var(--rc,var(--gold));color:var(--paper)}
.scale.demo span{display:block;text-align:center;border:1px solid var(--rule2);border-radius:4px;padding:5px 0;font-size:.88rem;font-weight:600;color:var(--muted);background:linear-gradient(90deg,transparent,transparent)}
.scale.demo span:first-child,.scale.demo span:last-child{color:var(--head);border-color:var(--gold)}
.samples{display:grid;gap:14px;margin-top:4px}
.guidebox{display:flex;flex-direction:column;gap:8px;background:var(--tint);border:1.5px dashed var(--gold);border-radius:10px;padding:14px 16px}
.red{color:var(--red)}
.badge{display:inline-block;background:var(--gold);color:var(--paper);font-size:.7rem;font-weight:700;letter-spacing:.08em;border-radius:99px;padding:1px 9px;margin-right:8px;vertical-align:1px}
.fullcap .svgbox{display:none}
.fullcap .cap{grid-row:1/-1;padding-top:16px}
.cmt.next{font-family:var(--serif);font-weight:700;color:var(--head);margin-top:6px}
.smpbadge rect{fill:var(--red)}
.smpbadge .sb1{fill:#ffffff;font-family:var(--sans);font-weight:700;font-size:23px;letter-spacing:.04em}
svg.sample .seg,svg.locked .seg{pointer-events:none;cursor:default}
svg.sample .seg path.val{fill-opacity:.45;stroke-dasharray:6 4}
.smp{display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:center}
.smp>div{min-width:0}
.smp b{font-family:var(--serif);color:var(--head);font-size:1.05rem}
.smp p{font-size:.9rem;color:var(--ink);line-height:1.55;margin-top:2px}
.mroll{width:100%;height:84px;display:block;border-bottom:1.5px solid var(--rule2)}
.scale-l b{color:var(--head);font-weight:700;margin-right:2px}
.scale-l{display:flex;justify-content:space-between;font-size:.74rem;color:var(--muted);margin-top:-6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.btn{border:1px solid var(--rule2);background:var(--card);border-radius:99px;padding:6px 16px;font-size:.88rem;font-weight:500;white-space:nowrap}
.btn.primary{background:var(--core);color:var(--core-ink);border-color:var(--core)}
.btn:disabled{opacity:.35;cursor:default}
.btn.reset{border-style:dashed;color:var(--muted)}
.btn.reset.armed{border-style:solid;border-color:var(--gold);color:var(--gold-ink);background:var(--tint)}
.prog{display:flex;gap:4px}
.prog i{width:18px;height:5px;border-radius:3px;background:var(--rule)}
.prog i.done{background:var(--gold-soft)}
.prog i.cur{background:var(--gold)}
.roll{width:100%;height:96px;display:block;border-bottom:1.5px solid var(--rule2)}
.verdict{font-family:var(--serif);font-weight:900;font-size:1.25rem;color:var(--head)}
.bars{display:grid;gap:4px}
.bar{display:grid;grid-template-columns:7.5rem 1fr 2rem;gap:8px;align-items:center;font-size:.86rem}
.bar .t{height:8px;background:var(--rule);border-radius:4px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--rc)}
.bar b{font-variant-numeric:tabular-nums;text-align:right;color:var(--head)}
.bar.low span{color:var(--gold-ink);font-weight:600}

/* SVG */
.seg path.bg{fill:var(--rc);fill-opacity:var(--seg);stroke:var(--paper);stroke-width:3;transition:fill-opacity .2s}
.seg{cursor:pointer}
.seg:hover path.bg,.seg.on path.bg{fill-opacity:var(--seg-on)}
.seg path.val{fill:var(--rc);fill-opacity:var(--fill);stroke:var(--paper);stroke-width:2;transition:d .25s}
.seg text{font-family:var(--serif);font-weight:700;font-size:19px;fill:var(--head);pointer-events:none}
.seg.on path.bg{stroke:var(--gold);stroke-width:3.5}
.rl{font-family:var(--serif);font-weight:900;font-size:21px;pointer-events:none;paint-order:stroke;stroke:var(--paper);stroke-width:6px;stroke-linejoin:round}
.gridc{fill:none;stroke:var(--grid);stroke-width:1}
.gridn{fill:var(--muted);font-size:12px;font-family:var(--sans)}
.spoke{stroke:var(--paper);stroke-width:3}
.hub circle{fill:var(--hub);fill-opacity:.2;stroke:var(--hub);stroke-width:2}
.hub{cursor:pointer}
.hub.on circle{stroke:var(--gold);stroke-width:4}
.hub text{font-family:var(--serif);font-weight:700;font-size:16px;fill:var(--hub)}
.axle{cursor:pointer}
.axle circle{fill:var(--core);stroke:var(--core-gold);stroke-width:3}
.axle.on circle{stroke-width:6}
.axle .a1{fill:var(--core-gold);font-size:12px;font-weight:600;letter-spacing:.12em;font-family:var(--sans)}
.axle .a2{fill:var(--core-ink);font-size:26px;font-weight:900;font-family:var(--serif)}
.rim{cursor:pointer}
.rim path{fill:var(--rim);fill-opacity:.14;stroke:var(--rim);stroke-width:2}
.rim.on path{stroke:var(--gold);stroke-width:4;fill-opacity:.24}
.rim text{font-family:var(--serif);font-weight:700;font-size:19px;fill:var(--rim)}
svg.diag .seg path.bg{fill-opacity:.06}
svg.diag .seg.on path.bg{fill-opacity:.14}
svg.diag .seg text{fill:var(--muted);font-size:17px}
.seg,.hub,.axle,.rim,.rl,.spokes,.intro{transition:opacity .45s ease}
.off{opacity:0;pointer-events:none}
.verse{fill:var(--muted);font-family:var(--serif);font-size:24px}
.verse.big{fill:var(--head);font-size:34px;font-weight:700}
.ghost{fill:none;stroke:var(--rule2);stroke-dasharray:3 7;stroke-width:1.5}
@media (prefers-reduced-motion: reduce){ .seg path.val,.seg path.bg,.seg,.hub,.axle,.rim,.rl,.spokes,.intro{transition:none} }

/* ===== 10:16 고정 프레임 (600 × 960) ===== */
.stage{grid-template-columns:1fr;grid-template-rows:526px minmax(0,1fr);padding:0 20px 12px;gap:4px}
.svgbox{height:526px}
.cap{align-self:stretch;height:100%;display:flex;flex-direction:column;gap:8px;max-height:100%}
.cap>*{flex:none}
.nav-row{margin-top:auto;min-height:38px;padding-top:6px}
.top{padding:12px 20px}
.top h1{font-size:1.24rem;white-space:nowrap}
.top .eb{font-size:.66rem;white-space:nowrap}
.mbtn{padding:5px 12px;font-size:.82rem;white-space:nowrap}
.modes{flex:none}
.cap h2{font-size:1.32rem;line-height:1.28}
.q{font-size:.98rem;line-height:1.6}
.src{margin-top:-4px}
.note{font-size:.86rem;line-height:1.55}
.map{font-size:.84rem;gap:1px 12px}
.subs p{font-size:.9rem;line-height:1.55}
.subs{gap:4px}
.hide-m{display:none}
.show-m{display:inline}
.roll{height:76px}
.bars{grid-template-columns:1fr 1fr;gap:5px 16px}
.bar{grid-template-columns:1fr auto;grid-template-areas:'n v' 't t';gap:2px 6px;line-height:1.3;font-size:.84rem}
.bar span{grid-area:n;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar b{grid-area:v}
.bar .t{grid-area:t;height:6px}
.verdict{font-size:1.1rem}
.k{font-size:.72rem}
.scale button{padding:5px 0;font-size:.88rem}
.qtext{font-size:1.05rem}
.btn{padding:6px 14px;font-size:.86rem}
.row{gap:8px}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <div class="eb">사송주님의교회</div>
      <h1>풍성한 삶의 수레바퀴</h1>
    </div>
    <div class="modes" role="group" aria-label="보기 방식">
      <button class="mbtn" id="mLearn" aria-pressed="true">풍성한 삶의 기초</button>
      <button class="mbtn" id="mDiag" aria-pressed="false">내 삶의 균형 점검</button>
    </div>
  </header>
  <main class="stage">
    <div class="svgbox"><svg class="wh" id="wh" viewBox="52 52 896 896" role="img" aria-label="풍성한 삶의 수레바퀴"></svg></div>
    <section class="cap" id="cap" aria-live="polite"></section>
  </main>
</div>

<script>
/* ===== 내용: 만남별 요약 자료에서 가져옴 ===== */
const REL=[
 {id:"god",name:"하나님과의 관계",part:"Ⅱ부 · 3–4강",rc:"--god",c:-90,
  line:["알아 간 만큼 사랑하게 되는 하나님, 예배와 기도와 순종으로 드리는 사랑.","4강"],
  keys:[{k:"알아가기",ex:"성경에서 하나님은 어떤 분이신지, 내게 무엇을 말씀하시는지 묻는다.",q:"성경이라는 보물창고를 통해 하나님을 알아가고 있나요?",src:"3강"},
        {k:"사랑하기",ex:"예배로 반응하고, 기도로 우정을 나누고, 순종으로 받은 사랑을 나눈다.",q:"예배·기도·순종으로 하나님께 사랑을 표현하고 있나요?",src:"4강"}]},
 {id:"self",name:"자신과의 관계",part:"Ⅲ부 · 5–6강",rc:"--self",c:0,
  line:["이미 새 생명을 얻고 그리스도와 함께 하늘에 앉은 나를 받아들이는 것이 나를 정말 사랑하는 것이다.","5강"],
  keys:[{k:"자기 부인",ex:"욕심·세상의 가치관·나쁜 습관·과거의 상처, 그리스도 밖의 옛 모습을 내려놓는다.",q:"그리스도 밖의 옛 모습, 곧 선을 넘은 욕심·세상의 가치관·나쁜 습관·과거의 상처를 부인하고 있나요?",src:"6강"},
        {k:"성령 충만",ex:"내 속에 계신 성령님께 인격적으로 동의하며 한 걸음씩 보조를 맞춰 걷는다.",q:"내 속에 계신 성령님과 한 걸음씩 보조를 맞춰 걷고 있나요?",src:"6강"}]},
 {id:"com",name:"공동체와의 관계",part:"Ⅳ부 · 7–8강",rc:"--com",c:90,
  line:["하나님을 정말 사랑하면 형제를 사랑하는 것으로 나타난다. 둘은 분리할 수 없다.","12강"],
  keys:[{k:"형제 사랑",ex:"이미 이루어진 공동체를 희생·진실·구체·중심이 있는 사랑으로 살아낸다.",q:"희생하고, 진실하고, 구체적이고, 중심이 있는 사랑으로 형제를 사랑하고 있나요?",src:"7강"},
        {k:"섬김의 도",ex:"낮아져 섬기고, 서로 복종하고, 용서하고, 나와 다른 사람을 용납한다.",q:"낮아져 섬기고, 서로 복종하고, 용서하고 용납하고 있나요?",src:"8강"}]},
 {id:"world",name:"세상과의 관계",part:"Ⅴ부 · 9–10강",rc:"--world",c:180,
  line:["우리는 그 다스림을 누리는 만큼 그것을 알릴 수 있다.","9강"],
  keys:[{k:"복음 전도",ex:"그리스도를 주로 모신 삶이 질문을 부르고, 간증과 복음으로 대답한다.",q:"하나님의 다스림을 누리는 만큼 삶과 말로 알리고 있나요?",src:"9강"},
        {k:"세상 경영",ex:"정의와 사랑을 원리로, 노동을 방법으로 맡겨진 세상을 성실하고 탁월하게 돌본다.",q:"내 일과 자리에서 정의와 사랑으로, 성실하고 탁월하게 일하고 있나요?",src:"10강"}]}
];
const SEGS=[]; REL.forEach(r=>r.keys.forEach((k,j)=>SEGS.push({...k,rel:r,a0:r.c-45+j*45,a1:r.c+j*45})));

/* ===== 기하 ===== */
const CX=500,CY=500, AX=58, HUB=108, SP0=108, SP1=388, RIM0=392, RIM1=440;
const lv=v=>SP0+(SP1-SP0)*v/10;
const NS="http://www.w3.org/2000/svg";
function el(t,a,p){const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);if(p)p.appendChild(n);return n;}
const P=(r,d)=>({x:CX+r*Math.cos(d*Math.PI/180),y:CY+r*Math.sin(d*Math.PI/180)});
function wedge(r0,r1,a0,a1){const p0=P(r1,a0),p1=P(r1,a1),p2=P(r0,a1),p3=P(r0,a0);
  return `M${p0.x},${p0.y} A${r1},${r1} 0 0,1 ${p1.x},${p1.y} L${p2.x},${p2.y} A${r0},${r0} 0 0,0 ${p3.x},${p3.y} Z`;}
const svg=document.getElementById('wh');
const defs=el('defs',{},svg);
// 처음 화면: 요한복음 10장 10절
const ghost=el('circle',{cx:CX,cy:CY,r:RIM1,class:'ghost'},svg);
const gIntro=el('g',{class:'intro'},svg);
el('text',{x:CX,y:CY-30,'text-anchor':'middle',class:'verse'},gIntro).textContent='내가 온 것은 양으로 생명을 얻게 하고';
el('text',{x:CX,y:CY+22,'text-anchor':'middle',class:'verse big'},gIntro).textContent='더욱 풍성히 얻게 하려 함이라';
el('text',{x:CX,y:CY+64,'text-anchor':'middle',class:'verse',style:'font-size:20px'},gIntro).textContent='요한복음 10장 10절';
// 테

 [{c:"복음을 전하려는 마음이 귀해요. 그런데 삶에 변화가 보이지 않으면 말이 힘을 잃어요. 일터와 일상에서 정의와 사랑으로, 성실하고 탁월하게 사는 모습이 함께 가야 해요.",w:"9강 다스림을 누리며 알리기 · 10강 성실함과 탁월함"},

const PRACTICE={

 self:"아침에 일어나자마자 세 문장을 선언해 보세요. “하나님이 그리스도 안에서 나를 받아들이셨다. 나는 그리스도 안에서 특별한 존재다. 나는 새로운 가족 공동체에 속했다.” 그리고 “성령님, 오늘도 한 걸음씩 함께 걷겠습니다”로 하루를 시작해 보세요.",

 world:"예수님을 만나기 전, 만난 일, 그 뒤의 변화로 내 간증을 한번 써 보세요. 성경책 앞장에 복음을 전하고 싶은 사람의 이름을 적고 기도해 보세요. 일터에서는 주님께 하듯 성실하고 탁월하게 일해 보세요."
};
function josa(w){const c=w.charCodeAt(w.length-1);return (c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28)?'이':'가';}
function analyze(){
  const v=vals.map(x=>x||0);
  const rel=REL.map((r,i)=>({r,i,v:(v[i*2]+v[i*2+1])/2}));
  const g=rel[0].v,sf=rel[1].v,cm=rel[2].v,wd=rel[3].v;
  let shape;
  if(rel.every(x=>x.v<=4))shape='low';
  else if(rel.every(x=>x.v>=8))shape='high';
  else if(g-(sf+cm+wd)/3>=3)shape='dual';
  else if((g+sf)/2-(cm+wd)/2>=2)shape='inner';
  else if((cm+wd)/2-(g+sf)/2>=2)shape='outer';
  else shape='mixed';
  let pair=null;
  rel.forEach(x=>{const a=v[x.i*2],b=v[x.i*2+1],d=Math.abs(a-b);if(d>=3&&(!pair||d>pair.d))pair={rel:x.r,i:x.i,d,hi:a>b?0:1,ka:x.r.keys[a>b?0:1].k,kb:x.r.keys[a>b?1:0].k};});
  const low=rel.reduce((a,b)=>b.v<a.v?b:a);
  const round=Math.max(...v)-Math.min(...v)<=2;
  return {v,rel,shape,pair,low,round};}
function lightRel(id){SEGS.forEach((sg,i)=>segEls[i].g.classList.toggle('on',sg.rel.id===id));}
function result(){clearOn();
  const A=analyze();
  cap.style.setProperty('--rc','var(--gold)');
  cap.innerHTML=`<span class="k">내 삶의 균형 점검 · 굴려 보기</span>
   <svg class="roll" id="roll" viewBox="0 0 400 96" preserveAspectRatio="xMidYMax meet" aria-label="바퀴가 굴러가는 모습"></svg>
   <p class="verdict">나의 바퀴는 ‘${A.round?(A.v.reduce((a,b)=>a+b,0)/8>=7?'크고 둥근 바퀴':'작지만 둥근 바퀴'):'찌그러진 바퀴'}’에 가까워요</p>
   <div class="bars">${A.rel.map(x=>`<div class="bar ${x===A.low&&!A.round?'low':''}" style="--rc:var(${x.r.rc})"><span>${x.r.name}</span><div class="t"><i style="width:${x.v*10}%"></i></div><b>${x.v%1?x.v.toFixed(1):x.v}</b></div>`).join('')}</div>
   <div class="row nav-row"><button class="btn" id="rBack">← 바퀴 읽는 법</button><button class="btn reset" id="rReset">점수 초기화</button><button class="btn primary" id="rCom">코멘트 보기 →</button></div>`;
  document.getElementById('rBack').onclick=()=>wheelsGuide();
  bindReset(document.getElementById('rReset'));
  document.getElementById('rCom').onclick=()=>comment(1);
  roll(document.getElementById('roll'),A.v);}
function comment(page){clearOn();
  const A=analyze();cap.style.setProperty('--rc','var(--gold)');
  if(page===1){const S=SHAPE[A.shape];
    if(A.pair)lightRel(A.pair.rel.id);
    const P=A.pair?PAIR[A.pair.i][A.pair.hi]:null;
    cap.innerHTML=`<div class="row"><span class="k">코멘트 1/2 · 나의 바퀴 읽기</span><div class="prog"><i class="cur"></i><i></i></div></div>
     <h2>${S.t}</h2>
     <p class="cmt">${S.c}</p><p class="why">코멘트 근거 · ${S.w}</p>
     ${P?`<p class="cmt-h" style="--rc:var(${A.pair.rel.rc})">${A.pair.rel.name} · ${A.pair.ka}${josa(A.pair.ka)} ${A.pair.kb}보다 길어요</p>
       <p class="cmt">${P.c}</p><p class="why">코멘트 근거 · ${P.w}</p>`:''}
     <div class="row nav-row"><button class="btn" id="cBack">← 결과로</button><button class="btn primary" id="cNext">앞으로 3개월 →</button></div>`;
    document.getElementById('cBack').onclick=()=>result();
    document.getElementById('cNext').onclick=()=>comment(2);
  }else{const r=A.low.r;lightRel(r.id);
    cap.innerHTML=`<div class="row"><span class="k">코멘트 2/2 · 앞으로 3개월</span><div class="prog"><i class="done"></i><i class="cur"></i></div></div>
     <h2>${r.name}에서 할 수 있는 한 가지</h2>
     <p class="cmt pr" style="--rc:var(${r.rc})">${PRACTICE[r.id]}</p>
     <p class="cmt">우리 속에 그리스도의 모습이 완성될 때까지 성령님은 우리를 포기하지 않으세요. 정한 것을 짝과 나누고 서로 기도해 주세요. 그리고 이 바퀴를 3개월 뒤에 다시 그려 보세요.</p>
     <p class="why">코멘트 근거 · 12강 맺음과 앞으로 3개월</p>
     <div class="row nav-row"><button class="btn" id="cBack">← 이전</button><button class="btn" id="cRes">결과로</button></div>`;
    document.getElementById('cBack').onclick=()=>comment(1);
    document.getElementById('cRes').onclick=()=>result();}
}
let rolls=[];
function stopRolls(){rolls.forEach(id=>cancelAnimationFrame(id.v));rolls=[];}
function roll(rs,v,o){if(!rs)return;o=Object.assign({base:14,k:3.2,GY:94,W:400},o||{});
  const base=o.base,k=o.k,GY=o.GY,W=o.W;
  const prof=d=>{let a=((d%360)+360)%360;
    const idx=SEGS.findIndex(s=>{let a0=((s.a0%360)+360)%360,a1=a0+45;return (a>=a0&&a<a1)||(a+360>=a0&&a+360<a1);});
    return base+(v[idx<0?0:idx]||0)*k;};
  const g=el('g',{},rs);const paths=SEGS.map((s,i)=>{const p=el('path',{},g);p.style.fill=`var(${s.rel.rc})`;p.style.fillOpacity='.85';return p;});
  const hubC=el('circle',{r:Math.max(2,base-2)},g);hubC.style.fill='var(--core)';
  const pad=base+10*k+4;let phi=0,x=-pad;const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const h={v:0};rolls.push(h);
  function frame(){const hh=prof(90-phi);
    paths.forEach((p,i)=>{const s=SEGS[i],R=base+(v[i]||0)*k;const a0=(s.a0+phi)*Math.PI/180,a1=(s.a1+phi)*Math.PI/180;
      p.setAttribute('d',`M0,0 L${R*Math.cos(a0)},${R*Math.sin(a0)} A${R},${R} 0 0,1 ${R*Math.cos(a1)},${R*Math.sin(a1)} Z`);});
    g.setAttribute('transform',`translate(${x},${GY-hh})`);
    if(reduce)return;
    phi+=2.2;x+=hh*2.2*Math.PI/180;if(x>W+pad){x=-pad;}
    h.v=requestAnimationFrame(frame);}
  if(reduce){x=W/2;}
  frame();}

function onSeg(i,ev){
  if(mode==='diag'&&!onQuestion)return; // 점검 모드에서는 질문 화면에서만 바퀴를 눌러 점수를 고를 수 있음 (안내·결과·코멘트 화면에서는 눌러도 아무 일 없음)
  if(mode==='learn'){learn(SEGS[i].rel.id);return;}
  if(ev){const pt=svg.createSVGPoint();pt.x=ev.clientX;pt.y=ev.clientY;const p=pt.matrixTransform(svg.getScreenCTM().inverse());
    const r=Math.hypot(p.x-CX,p.y-CY);const v=Math.max(1,Math.min(10,Math.ceil((r-SP0)/((SP1-SP0)/10))));vals[i]=v;save();drawVals();}
  cur=i;diagCap();}
function bindKey(g,f){g.addEventListener('click',f);g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();f();}});}
bindKey(axle,()=>{if(mode==='learn')learn('axle');});
bindKey(hub,()=>{if(mode==='learn')learn('hub');});
bindKey(rim,()=>{if(mode==='learn')learn('rim');});
function setMode(m){mode=m;stopRolls();
  document.getElementById('mLearn').setAttribute('aria-pressed',String(m==='learn'));
  document.getElementById('mDiag').setAttribute('aria-pressed',String(m==='diag'));
  svg.classList.toggle('diag',m==='diag');gGrid.style.display=m==='diag'?'':'none';drawVals();applyBuilt();
  if(m==='learn'){learnStep(complete?STEPS.length-1:0);}else{diagIntro();}}
document.getElementById('mLearn').onclick=()=>setMode('learn');
document.getElementById('mDiag').onclick=()=>setMode('diag');
setMode('learn');
/* 10:16 프레임을 화면에 맞게 통째로 확대·축소 (안의 배치는 그대로) */
function fit(){const m=16;const fs=Math.min((innerWidth-m)/600,(innerHeight-m)/960);document.querySelector('.app').style.setProperty('--fs',Math.max(.3,fs).toFixed(4));}
addEventListener('resize',fit);fit();
